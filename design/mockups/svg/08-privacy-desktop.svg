<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1440" height="989" viewBox="0 0 1440 989">
  <title>GrowTH — Privacy notice — desktop 1440px</title>
  <desc>Route /privacy. High-fidelity vector export for Figma. Text is editable; icons are vector paths.</desc>
  <defs></defs>
  <rect width="1440" height="989" fill="#ffffff"/>
<g data-name="body"><rect x="0.0" y="0.0" width="1440.0" height="988.8" fill="#f8f9ff"/><g data-name="div"><g data-name="min-h-svh"><rect x="0.0" y="0.0" width="1440.0" height="988.8" fill="#f8f9ff"/><g data-name="max-w-2xl"><rect x="384.0" y="40.0" width="672.0" height="908.8" rx="16.0" fill="#ffffff"/><g data-name="text-xl"><text x="416.0" y="88.0" font-family="Manrope" font-size="20" font-weight="600" fill="#004640" textLength="135.0" lengthAdjust="spacingAndGlyphs">Privacy Notice</text></g><g data-name="p"><text x="416.0" y="137.2" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="608.0" lengthAdjust="spacingAndGlyphs">GrowTH is a class project (Digital Media Engineering, Khon Kaen University) for tracking child</text><text x="416.0" y="159.9" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="578.0" lengthAdjust="spacingAndGlyphs">growth, puberty development, and AI-assisted bone age screening. This notice explains</text><text x="416.0" y="182.7" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="577.0" lengthAdjust="spacingAndGlyphs">what data we collect, why, and how it's handled, in the spirit of Thailand's Personal Data</text><text x="416.0" y="205.4" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="149.0" lengthAdjust="spacingAndGlyphs">Protection Act (PDPA).</text></g><g data-name="font-semibold"><text x="416.0" y="251.2" font-family="Manrope" font-size="14" font-weight="600" fill="#0b1c30" textLength="108.0" lengthAdjust="spacingAndGlyphs">What we collect</text></g><g data-name="list-disc"><g data-name="li"><text x="436.0" y="290.9" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="394.0" lengthAdjust="spacingAndGlyphs">Account: full name, email, phone number, hashed password.</text></g><g data-name="li"><text x="436.0" y="317.7" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="468.0" lengthAdjust="spacingAndGlyphs">Child profile: name, sex, date of birth, and your relationship to the child.</text></g><g data-name="li"><text x="436.0" y="344.4" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="367.0" lengthAdjust="spacingAndGlyphs">Growth records: height, weight, and the date measured.</text></g><g data-name="li"><text x="436.0" y="371.2" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="315.0" lengthAdjust="spacingAndGlyphs">Puberty screening answers, as reported by you.</text></g><g data-name="li"><text x="436.0" y="397.9" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="496.0" lengthAdjust="spacingAndGlyphs">Bone-age X-ray images you choose to upload, and any resulting prediction.</text></g></g><g data-name="p"><text x="416.0" y="436.7" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="602.0" lengthAdjust="spacingAndGlyphs">We only collect what each feature needs to function (data minimization) — nothing is sold or</text><text x="416.0" y="459.4" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="163.0" lengthAdjust="spacingAndGlyphs">shared with third parties.</text></g><g data-name="font-semibold"><text x="416.0" y="505.2" font-family="Manrope" font-size="14" font-weight="600" fill="#0b1c30" textLength="91.0" lengthAdjust="spacingAndGlyphs">How it's used</text></g><g data-name="p"><text x="416.0" y="545.0" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="598.0" lengthAdjust="spacingAndGlyphs">To calculate growth percentiles/SDS against standard pediatric growth references, compile</text><text x="416.0" y="567.7" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="592.0" lengthAdjust="spacingAndGlyphs">puberty screening summaries, and (once connected) run bone-age prediction — all shown</text><text x="416.0" y="590.5" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="543.0" lengthAdjust="spacingAndGlyphs">back to you inside your own account. None of these results are a clinical diagnosis.</text></g><g data-name="font-semibold"><text x="416.0" y="636.2" font-family="Manrope" font-size="14" font-weight="600" fill="#0b1c30" textLength="102.0" lengthAdjust="spacingAndGlyphs">How it's stored</text></g><g data-name="p"><text x="416.0" y="676.0" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="591.0" lengthAdjust="spacingAndGlyphs">Data lives in a PostgreSQL database. Passwords are hashed (never stored in plain text). A</text><text x="416.0" y="698.7" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="594.0" lengthAdjust="spacingAndGlyphs">child's records are only visible to accounts linked to that child as a guardian — not to other</text><text x="416.0" y="721.5" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="39.0" lengthAdjust="spacingAndGlyphs">users.</text></g><g data-name="font-semibold"><text x="416.0" y="767.2" font-family="Manrope" font-size="14" font-weight="600" fill="#0b1c30" textLength="91.0" lengthAdjust="spacingAndGlyphs">Your controls</text></g><g data-name="p"><text x="416.0" y="807.0" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="575.0" lengthAdjust="spacingAndGlyphs">You can edit or delete any growth record, puberty screening, or child profile at any time</text><text x="416.0" y="829.7" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="560.0" lengthAdjust="spacingAndGlyphs">from within the app. You can delete your entire account from your Profile page, which</text><text x="416.0" y="852.5" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="417.0" lengthAdjust="spacingAndGlyphs">removes your login and unlinks you from any children's records.</text></g><g data-name="text-brand-600"><text x="416.0" y="907.2" font-family="Inter" font-size="14" font-weight="500" fill="#005850" textLength="146.7" lengthAdjust="spacingAndGlyphs">← Back to registration</text></g></g></g></g></g>
</svg>
