<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="390" height="1421" viewBox="0 0 390 1421">
  <title>GrowTH — Privacy notice — mobile 390px</title>
  <desc>Route /privacy. High-fidelity vector export for Figma. Text is editable; icons are vector paths.</desc>
  <defs></defs>
  <rect width="390" height="1421" fill="#ffffff"/>
<g data-name="body"><rect x="0.0" y="0.0" width="390.0" height="1421.0" fill="#f8f9ff"/><g data-name="div"><g data-name="min-h-svh"><rect x="0.0" y="0.0" width="390.0" height="1421.0" fill="#f8f9ff"/><g data-name="max-w-2xl"><rect x="16.0" y="40.0" width="358.0" height="1341.0" rx="16.0" fill="#ffffff"/><g data-name="text-xl"><text x="48.0" y="88.0" font-family="Manrope" font-size="20" font-weight="600" fill="#004640" textLength="135.0" lengthAdjust="spacingAndGlyphs">Privacy Notice</text></g><g data-name="p"><text x="48.0" y="137.2" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="260.0" lengthAdjust="spacingAndGlyphs">GrowTH is a class project (Digital Media</text><text x="48.0" y="159.9" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="251.0" lengthAdjust="spacingAndGlyphs">Engineering, Khon Kaen University) for</text><text x="48.0" y="182.7" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="293.0" lengthAdjust="spacingAndGlyphs">tracking child growth, puberty development,</text><text x="48.0" y="205.4" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="272.0" lengthAdjust="spacingAndGlyphs">and AI-assisted bone age screening. This</text><text x="48.0" y="228.2" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="276.0" lengthAdjust="spacingAndGlyphs">notice explains what data we collect, why,</text><text x="48.0" y="250.9" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="233.0" lengthAdjust="spacingAndGlyphs">and how it's handled, in the spirit of</text><text x="48.0" y="273.7" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="260.0" lengthAdjust="spacingAndGlyphs">Thailand's Personal Data Protection Act</text><text x="48.0" y="296.4" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="51.0" lengthAdjust="spacingAndGlyphs">(PDPA).</text></g><g data-name="font-semibold"><text x="48.0" y="342.2" font-family="Manrope" font-size="14" font-weight="600" fill="#0b1c30" textLength="108.0" lengthAdjust="spacingAndGlyphs">What we collect</text></g><g data-name="list-disc"><g data-name="li"><text x="68.0" y="381.9" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="270.0" lengthAdjust="spacingAndGlyphs">Account: full name, email, phone number,</text><text x="68.0" y="404.7" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="120.0" lengthAdjust="spacingAndGlyphs">hashed password.</text></g><g data-name="li"><text x="68.0" y="431.4" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="246.0" lengthAdjust="spacingAndGlyphs">Child profile: name, sex, date of birth,</text><text x="68.0" y="454.2" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="218.0" lengthAdjust="spacingAndGlyphs">and your relationship to the child.</text></g><g data-name="li"><text x="68.0" y="480.9" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="260.0" lengthAdjust="spacingAndGlyphs">Growth records: height, weight, and the</text><text x="68.0" y="503.7" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="103.0" lengthAdjust="spacingAndGlyphs">date measured.</text></g><g data-name="li"><text x="68.0" y="530.5" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="262.0" lengthAdjust="spacingAndGlyphs">Puberty screening answers, as reported</text><text x="68.0" y="553.2" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="49.0" lengthAdjust="spacingAndGlyphs">by you.</text></g><g data-name="li"><text x="68.0" y="580.0" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="252.0" lengthAdjust="spacingAndGlyphs">Bone-age X-ray images you choose to</text><text x="68.0" y="602.7" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="240.0" lengthAdjust="spacingAndGlyphs">upload, and any resulting prediction.</text></g></g><g data-name="p"><text x="48.0" y="641.5" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="283.0" lengthAdjust="spacingAndGlyphs">We only collect what each feature needs to</text><text x="48.0" y="664.2" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="267.0" lengthAdjust="spacingAndGlyphs">function (data minimization) — nothing is</text><text x="48.0" y="687.0" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="211.0" lengthAdjust="spacingAndGlyphs">sold or shared with third parties.</text></g><g data-name="font-semibold"><text x="48.0" y="732.7" font-family="Manrope" font-size="14" font-weight="600" fill="#0b1c30" textLength="91.0" lengthAdjust="spacingAndGlyphs">How it's used</text></g><g data-name="p"><text x="48.0" y="772.5" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="290.0" lengthAdjust="spacingAndGlyphs">To calculate growth percentiles/SDS against</text><text x="48.0" y="795.2" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="249.0" lengthAdjust="spacingAndGlyphs">standard pediatric growth references,</text><text x="48.0" y="818.0" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="282.0" lengthAdjust="spacingAndGlyphs">compile puberty screening summaries, and</text><text x="48.0" y="840.7" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="279.0" lengthAdjust="spacingAndGlyphs">(once connected) run bone-age prediction</text><text x="48.0" y="863.5" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="266.0" lengthAdjust="spacingAndGlyphs">— all shown back to you inside your own</text><text x="48.0" y="886.2" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="285.0" lengthAdjust="spacingAndGlyphs">account. None of these results are a clinical</text><text x="48.0" y="909.0" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="66.0" lengthAdjust="spacingAndGlyphs">diagnosis.</text></g><g data-name="font-semibold"><text x="48.0" y="954.7" font-family="Manrope" font-size="14" font-weight="600" fill="#0b1c30" textLength="102.0" lengthAdjust="spacingAndGlyphs">How it's stored</text></g><g data-name="p"><text x="48.0" y="994.5" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="244.0" lengthAdjust="spacingAndGlyphs">Data lives in a PostgreSQL database.</text><text x="48.0" y="1017.2" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="290.0" lengthAdjust="spacingAndGlyphs">Passwords are hashed (never stored in plain</text><text x="48.0" y="1040.0" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="267.0" lengthAdjust="spacingAndGlyphs">text). A child's records are only visible to</text><text x="48.0" y="1062.7" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="278.0" lengthAdjust="spacingAndGlyphs">accounts linked to that child as a guardian</text><text x="48.0" y="1085.5" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="137.0" lengthAdjust="spacingAndGlyphs">— not to other users.</text></g><g data-name="font-semibold"><text x="48.0" y="1131.2" font-family="Manrope" font-size="14" font-weight="600" fill="#0b1c30" textLength="91.0" lengthAdjust="spacingAndGlyphs">Your controls</text></g><g data-name="p"><text x="48.0" y="1171.0" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="273.0" lengthAdjust="spacingAndGlyphs">You can edit or delete any growth record,</text><text x="48.0" y="1193.7" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="266.0" lengthAdjust="spacingAndGlyphs">puberty screening, or child profile at any</text><text x="48.0" y="1216.5" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="265.0" lengthAdjust="spacingAndGlyphs">time from within the app. You can delete</text><text x="48.0" y="1239.2" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="281.0" lengthAdjust="spacingAndGlyphs">your entire account from your Profile page,</text><text x="48.0" y="1262.0" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="272.0" lengthAdjust="spacingAndGlyphs">which removes your login and unlinks you</text><text x="48.0" y="1284.7" font-family="Inter" font-size="14" font-weight="400" fill="#0b1c30" textLength="183.0" lengthAdjust="spacingAndGlyphs">from any children's records.</text></g><g data-name="text-brand-600"><text x="48.0" y="1339.5" font-family="Inter" font-size="14" font-weight="500" fill="#005850" textLength="146.7" lengthAdjust="spacingAndGlyphs">← Back to registration</text></g></g></g></g></g>
</svg>
