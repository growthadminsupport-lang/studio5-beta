name: Keep backend awake

# Pings /health on Render's free instance. What it can and cannot do, measured 2026-09-14:
#
# - It does NOT keep the service resident on its own. GitHub runs scheduled workflows
#   best-effort: the cron below asks for every 10 minutes, but runs landed roughly every two
#   hours. Render sleeps after ~15 minutes idle, so most pings arrive at a cold instance and take
#   30-60s. Read it as a liveness check that fails loudly when the backend is actually down.
# - To really keep it awake, point an external pinger at the same URL every 10-14 minutes:
#   cron-job.org or UptimeRobot (both free), or a crontab on any always-on machine. That uses
#   ~730 of the free plan's 750 instance-hours a month, so it only fits while growth-api is
#   the only free web service in the Render workspace.
# - GitHub disables scheduled workflows after 60 days with no repository activity. If this
#   stops running, re-enable it under the Actions tab.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        # A cold wake regularly takes 30-60s and occasionally longer; one run failed at the old
        # 90s limit. A longer timeout plus one retry separates "was asleep" from "is down".
        # BACKEND_URL is a repository variable (Settings > Secrets and variables > Actions >
        # Variables), e.g. https://growth-api-xxxx.onrender.com, so moving the service never
        # needs a code change.
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          test -n "$BACKEND_URL" || { echo "Set the BACKEND_URL repository variable"; exit 1; }
          curl --fail --silent --show-error --max-time 120 --retry 1 --retry-delay 5 \
            "$BACKEND_URL/health"
