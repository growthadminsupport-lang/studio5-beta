name: Keep backend awake

# Render's free plan spins the backend down after ~15 minutes with no traffic, and the
# cold wake is what makes login/signup feel broken after a quiet night. Pinging /health
# every 10 minutes keeps the container resident, so the first real user of the day gets
# the same ~70ms login as everyone else.
#
# This fits the free plan's 750 instance-hours/month (a full month is ~730), but it uses
# essentially all of them — so it only works while growth-backend is the only free web
# service in the Render account.
#
# Caveat: GitHub disables scheduled workflows on repos with no activity for 60 days.
# If logins start feeling slow again after a long quiet stretch, check this workflow is
# still enabled before digging into the app.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl --fail --silent --show-error --max-time 90 \
            https://growth-backend-a479.onrender.com/health
