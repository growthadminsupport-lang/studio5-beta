server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Bone-age X-rays are full-resolution images; nginx's 1M default rejects them with a
    # 413 before the request ever reaches the API's own multer limits.
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Everything under /api is stripped of that prefix and handed to the backend, which
    # serves its routes from the root (/auth/login, /children, /uploads/...). The trailing
    # slash on proxy_pass is what performs the strip — removing it would forward /api/auth
    # verbatim and 404 every call.
    location /api/ {
        proxy_pass http://api:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A cold or busy API shouldn't surface as a gateway timeout mid-login.
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Hashed asset filenames are immutable, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: any unknown path is a React Router route, not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
