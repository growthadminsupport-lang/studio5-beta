services:
  - type: web
    name: growth-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    # Migrations run at build time, not start time. The free plan spins the service down
    # after ~15 min idle, so startCommand runs again on every cold wake — and `npx prisma
    # migrate deploy` there cost 10-20s of package resolution + a DB round trip on each
    # one, for a migration set that hasn't changed since the build. Building it in means a
    # wake is just "boot Node", which is what the user actually waits on at the login form.
    # `prisma db seed` runs here too. The Parenting Resources articles are content the repo
    # owns — nothing in the app can create or edit an article, so the seed is their only
    # source. It's upsert-only and idempotent, so re-running it on every deploy just
    # republishes whatever prisma/articles-content.ts currently says.
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.23.1
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      # Password reset links are built from this. Unset, MailService falls back to
      # http://localhost:5173 and every reset email points at the recipient's own machine.
      - key: FRONTEND_URL
        sync: false
      # Reset-email delivery. Render blocks outbound SMTP, so Resend's HTTP API is the only
      # transport that works here. Declared rather than left implicit because with it unset
      # the forgot-password request still returns 200 and the user simply receives nothing.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Where the backend reaches the bone-age model. Unset is a supported state: uploads
      # still store and list, predictions stay PENDING, nothing errors.
      - key: BONE_AGE_SERVICE_URL
        sync: false
      - key: BONE_AGE_TIMEOUT_MS
        value: 30000

  - type: web
    name: growth-ai
    runtime: python
    plan: free
    region: singapore
    rootDir: ai-service
    # The model is a Release asset, not a repo file. A 16 MB binary in git would be carried
    # by every clone forever and duplicated on each retrain; Releases are built for this and
    # do not consume the account's Git LFS quota.
    #
    # Runtime is ONNX Runtime, not torch. torch needs 635 MB on disk and 374 MB resident,
    # which does not fit this 512 MB instance alongside uvicorn. ONNX is ~100 MB resident at
    # ~24 ms per inference and matches torch to 3e-06. Conversion happens locally, once —
    # see ai-service/convert_to_onnx.py.
    buildCommand: >-
      pip install -r requirements.txt &&
      mkdir -p models &&
      curl -fsSL -o models/bone_age.onnx
      https://github.com/MONNNNNNNNNNN/project_stu5/releases/download/model-v1/bone_age.onnx
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MODEL_PATH
        value: models/bone_age.onnx
      - key: MODEL_VERSION
        value: effnetb0-v1-rsna
      # ⚠ Both required before /predict will answer. The checkpoint's training target was
      # normalised — it emits ~2.4, not ~120 — so months = raw * AGE_STD + AGE_MEAN. Until
      # the ML team supplies the training-run values, /health reports "uncalibrated" and
      # /predict returns 503. It refuses rather than inventing a bone age.
      - key: AGE_MEAN
        sync: false
      - key: AGE_STD
        sync: false
      # Measured on the held-out test set, reported by the ML team 2026-08-18.
      # MAE 8.78 mo · MSE 135.91 · R² 0.9219 · within ±12 mo 73.1%
      - key: MAE_MONTHS
        value: "8.78"
      # The mean hides the spread: roughly one estimate in four is out by more than a year.
      # FR-18 has to say that rather than quoting ±8.78 as if it were a bound.
      - key: ACCURACY_WITHIN_12M
        value: "0.731"
